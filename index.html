<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reloj Analógico</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #1e1e2e;
      margin: 0;
    }
    .reloj {
      width: 250px;
      height: 250px;
      border: 8px solid #ffffff;
      border-radius: 50%;
      position: relative;
      background: #11111b;
    }
    .aguja {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom center;
      border-radius: 4px;
    }
    #aguja-horas {
      width: 6px;
      height: 60px;
      margin-left: -3px;
      background: #89b4fa;
    }
    #aguja-minutos {
      width: 4px;
      height: 85px;
      margin-left: -2px;
      background: #a6e3a1;
    }
    #aguja-segundos {
      width: 2px;
      height: 100px;
      margin-left: -1px;
      background: #f38ba8;
    }
  </style>
</head>
<body>

  <div class="reloj">
    <div id="aguja-horas" class="aguja"></div>
    <div id="aguja-minutos" class="aguja"></div>
    <div id="aguja-segundos" class="aguja"></div>
  </div>

  <script src="reloj.js"></script>

</body>
</html>
